# Milvus standalone（etcd + MinIO + milvus）。
#
# 镜像版本参照 milvus-io/milvus 官方 deployments/docker/standalone/docker-compose.yml
# 校对过（2026-11 官方为 milvus v3.0.5 / etcd v3.5.25 / milvusdb/minio）。
#
# ⚠️ 三个必须知道的事实：
#
# 1. **本机没法验证**：Windows 上跑它需要 WSL2（未安装，装完要重启），
#    且 Milvus standalone 官方建议 ≥8GB 内存，本机可用只有 5GB 出头。
#    所以这份文件是"按官方模板改的、镜像 tag 已核实存在"，但**没有真正起过**。
# 2. **MinIO 不能用 docker.io/minio/minio**：该仓库已从 Docker Hub 撤下（404），
#    Bitnami 的镜像目录也已清空。Milvus 官方改用自建镜像 milvusdb/minio。
# 3. 端口 19530 给 SDK 连接，9091 给健康检查。灌完索引后跑
#    `python scripts/verify_milvus.py --uri http://<host>:19530 --expect 126` 验收。
#
# 启动：  docker compose -f deploy/milvus-compose.yml up -d
# 状态：  docker compose -f deploy/milvus-compose.yml ps
# 停止：  docker compose -f deploy/milvus-compose.yml down
#
# 客户端只需要两个环境变量：
#   MILVUS_URI=http://<host>:19530
#   MILVUS_COLLECTION=kb_chunks

x-milvus-image: &milvus-image milvusdb/milvus:v3.0.5

services:
  # 一次性任务：把数据卷的属主改成容器内 milvus 用户。
  # 官方 compose 里有这一步，缺了它首次启动可能因卷权限失败。
  milvus-volume-init:
    image: *milvus-image
    container_name: rag-kb-milvus-init
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - milvus-data:/var/lib/milvus

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: rag-kb-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: >
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: rag-kb-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: *milvus-image
    container_name: rag-kb-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1          # 官方 compose 有这一项，缺了连 MinIO 可能报 region
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # SDK
      - "9091:9091"     # healthz / metrics
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      minio:
        condition: service_started

volumes:
  etcd-data:
  minio-data:
  milvus-data:

networks:
  default:
    name: rag-kb-milvus
